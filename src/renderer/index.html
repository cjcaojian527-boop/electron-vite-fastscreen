<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>FastScreen录屏</title>
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">

  <link rel="stylesheet" href="/src/assets/skeleton-container.css">
</head>

<body>

  <div id="skeleton-container">
    <!-- 骨架屏容器 -->
    <div class="skeleton-card">
      <div class="skeleton-image"></div>
      <div class="skeleton-title skeleton-line"></div>
      <div class="skeleton-text skeleton-line" style="width: 95%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 80%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 60%;"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-image"></div>
      <div class="skeleton-title skeleton-line"></div>
      <div class="skeleton-text skeleton-line" style="width: 90%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 75%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 50%;"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-image"></div>
      <div class="skeleton-title skeleton-line"></div>
      <div class="skeleton-text skeleton-line" style="width: 85%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 70%;"></div>
      <div class="skeleton-text skeleton-line" style="width: 55%;"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
